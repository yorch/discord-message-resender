[project]
name = "resender-ingest"
version = "0.1.0"
description = "Captures Discord alert messages, archives them, and forwards them onward"
requires-python = ">=3.13"
dependencies = [
    "discord.py-self>=2.1.0,<3",
    "asyncpg>=0.30",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
resender-ingest = "resender.__main__:main"
resender-check-token = "resender.validate:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resender"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded fake tokens in fixtures

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
